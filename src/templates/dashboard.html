<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Home Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="sidebar">
    <h1 class="logo">
      <i class="fas fa-home"></i> SmartHome
    </h1>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="nav-item active">
        <i class="fas fa-th-large"></i> Dashboard
      </a>
      <a href="{{ url_for('devices') }}" class="nav-item">
        <i class="fas fa-lightbulb"></i> Devices
      </a>
      <a href="{{ url_for('settings') }}" class="nav-item">
        <i class="fas fa-cog"></i> Settings
      </a>
    </nav>
  </div>

  <div class="main-content">
    <h2 class="page-title">Dashboard</h2>
    <p class="page-subtitle">Real-time sensor monitoring</p>

    <div class="widget-container" id="widgetContainer">
      {% for w in widgets %}
        <div class="widget">
          <div class="widget-content">
            <h4>{{ w.title }}</h4>
            <p class="widget-meta">{{ w.sensor }} | {{ w.calc }}</p>
            <span class="live-value" data-id="{{ w.id }}">--</span>
            <p class="last-updated" data-time-id="{{ w.id }}">Updated: --</p>
            <p>Source: {{ w.type }}</p>
          </div>
          <button class="delete-widget" data-widget-id="{{ w.id }}">
            <i class="fas fa-times"></i>
          </button>
        </div>
      {% endfor %}
    </div>
  </div>

  <button class="addCardButton"> + </button>

  <div class="modal" id="widgetModal">
      <div class="modal-content">
        <h3>Create Widget</h3>

        <label>Display Mode</label>
        <select id="displayMode">
          <option value="value">Single Value (Live)</option>
          <option value="graph">Trend Graph (Last 20 pts)</option>
        </select>

        <label>Widget Title</label>
        <input type="text" id="widgetTitle" placeholder="e.g. Living Room" />

        <label>Location (Table)</label>
        <select id="widgetType">
          {% if db_tables %}
            {% for table in db_tables %}
              <option value="{{ table }}">{{ table|capitalize }}</option>
            {% endfor %}
          {% else %}
            <option value="">No tables found</option>
          {% endif %}
        </select>

        <label>Sensor Type</label>
        <select id="sensorType">
          <option value="Temp">Temperature</option>
          <option value="Hum">Humidity</option>
          <option value="Press">CO2</option>
        </select>

        <div id="calcSection">
          <label>Calculation</label>
          <select id="widgetCalc">
            <option value="last">Current Value</option>
            <option value="avg">Average</option>
            <option value="min">Minimum</option>
            <option value="max">Maximum</option>
          </select>
        </div>

        <div class="modal-buttons">
          <button id="cancelBtn" style="background: transparent; color: #94a3b8;">Cancel</button>
          <button id="createBtn">Create</button>
        </div>
      </div>
    </div>

<script>
/**
 * 1. GLOBÁLNÍ KONSTANTY A STAV
 */
const container = document.getElementById('widgetContainer');
const modal = document.getElementById('widgetModal');
const addBtn = document.querySelector('.addCardButton');
const cancelBtn = document.getElementById('cancelBtn');
const createBtn = document.getElementById('createBtn');

// Pole pro výběr v modalu
const displayModeSelect = document.getElementById('displayMode');
const calcSection = document.getElementById('calcSection'); // Ujisti se, že máš toto ID v HTML kolem Calculation

const chartInstances = {};

/**
 * Pomocná funkce pro lidsky čitelný čas
 */
function getTimeAgo(dateString) {
  if (!dateString || dateString === "None" || dateString === "null") return "Never";
  const past = new Date(dateString.replace(/-/g, "/"));
  const now = new Date();
  const seconds = Math.floor((now - past) / 1000);

  if (seconds < 60) return "Just now";
  if (seconds < 3600) return Math.floor(seconds / 60) + "m ago";
  if (seconds < 86400) return Math.floor(seconds / 3600) + "h ago";
  return Math.floor(seconds / 86400) + "d ago";
}

/**
 * 2. PŘEPÍNÁNÍ MODALU (LOGIKA ROZDÍLNÉHO NASTAVENÍ)
 */
displayModeSelect.addEventListener('change', function() {
  // Pokud je vybrán graf, schováme sekci s výpočtem (avg, min, max)
  if (this.value === 'graph') {
    calcSection.style.setProperty('display', 'none', 'important');
  } else {
    calcSection.style.setProperty('display', 'block', 'important');
  }
});

// Otevření modalu a reset polí
addBtn.onclick = () => {
  modal.style.display = 'flex';
  // Reset na výchozí hodnoty
  displayModeSelect.value = 'value';
  calcSection.style.display = 'block';
  document.getElementById('widgetTitle').value = '';
};

cancelBtn.onclick = () => {
  modal.style.display = 'none';
};

/**
 * 3. API A REFRESH LOGIKA
 */
function refreshWidget(widgetId, mode) {
  const url = (mode === 'graph') ? `/api/widget_history/${widgetId}` : `/api/widget_data/${widgetId}`;

  fetch(url)
    .then(res => res.json())
    .then(data => {
      const timeEl = document.querySelector(`.last-updated[data-time-id="${widgetId}"]`);

      if (mode === 'graph') {
        renderMiniChart(widgetId, data.labels, data.values);
        if (timeEl && data.latest_timestamp) {
          timeEl.setAttribute('data-raw-time', data.latest_timestamp);
          timeEl.innerText = `Updated: ${getTimeAgo(data.latest_timestamp)}`;
        }
      } else {
        const valEl = document.querySelector(`.live-value[data-id="${widgetId}"]`);
        if (valEl) {
          valEl.innerText = data.value;
          valEl.style.opacity = 0.5;
          setTimeout(() => valEl.style.opacity = 1, 200);
        }
        if (timeEl && data.timestamp) {
          timeEl.setAttribute('data-raw-time', data.timestamp);
          timeEl.innerText = `Updated: ${getTimeAgo(data.timestamp)}`;
        }
      }
    })
    .catch(err => console.error("Data refresh error:", err));
}

/**
 * 4. RENDEROVÁNÍ GRAFU
 */
function renderMiniChart(widgetId, labels, values) {
  const canvas = document.getElementById(`chart-${widgetId}`);
  if (!canvas) return;

  if (chartInstances[widgetId]) {
    chartInstances[widgetId].destroy();
  }

  chartInstances[widgetId] = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        data: values,
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59, 130, 246, 0.1)',
        borderWidth: 2,
        pointRadius: 0,
        fill: true,
        tension: 0.4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { display: false },
        y: {
          grid: { color: '#334155' },
          ticks: { color: '#94a3b8', font: { size: 10 } }
        }
      }
    }
  });
}

/**
 * 5. ŽIVOTNÍ CYKLUS WIDGETU (MAZÁNÍ A VYTVÁŘENÍ)
 */
function setupDeleteListener(buttonElement) {
  buttonElement.addEventListener('click', (event) => {
    const widgetId = event.currentTarget.getAttribute('data-widget-id');
    const widgetElement = event.currentTarget.closest('.widget');

    fetch('/delete_widget', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: widgetId })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (chartInstances[widgetId]) chartInstances[widgetId].destroy();
        widgetElement.remove();
      }
    });
  });
}

createBtn.addEventListener('click', () => {
  const mode = displayModeSelect.value;
  const payload = {
    title: document.getElementById('widgetTitle').value,
    type: document.getElementById('widgetType').value,
    sensor: document.getElementById('sensorType').value,
    calc: mode === 'graph' ? 'last' : document.getElementById('widgetCalc').value, // U grafu posíláme default 'last'
    mode: mode
  };

  if (!payload.title) return alert("Title is required");

  fetch('/add_widget', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      const widget = document.createElement('div');
      widget.classList.add('widget');

      const displayContent = (payload.mode === 'graph')
        ? `<div style="height: 100px; margin: 10px 0;"><canvas id="chart-${data.id}"></canvas></div>`
        : `<span class="live-value" data-id="${data.id}">--</span>`;

      widget.innerHTML = `
        <div class="widget-content">
          <h4>${payload.title}</h4>
          <p class="widget-meta">${payload.sensor.toUpperCase()} | ${payload.mode === 'graph' ? 'TREND' : payload.calc.toUpperCase()}</p>
          ${displayContent}
          <p class="last-updated" data-time-id="${data.id}">Updated: --</p>
          <p>Source: ${payload.type}</p>
        </div>
        <button class="delete-widget" data-widget-id="${data.id}">
          <i class="fas fa-times"></i>
        </button>
      `;

      container.appendChild(widget);
      setupDeleteListener(widget.querySelector('.delete-widget'));
      refreshWidget(data.id, payload.mode);

      modal.style.display = 'none';
    }
  });
});

/**
 * 6. INICIALIZACE A TIMERY
 */
// Prvotní načtení všech existujících widgetů
document.querySelectorAll('.delete-widget').forEach(setupDeleteListener);
document.querySelectorAll('.widget').forEach(w => {
  const delBtn = w.querySelector('.delete-widget');
  if (delBtn) {
    const id = delBtn.dataset.widgetId;
    const isGraph = !!w.querySelector('canvas');
    refreshWidget(id, isGraph ? 'graph' : 'value');
  }
});

// Timer: Refresh dat z DB (5 min)
setInterval(() => {
  document.querySelectorAll('.widget').forEach(w => {
    const delBtn = w.querySelector('.delete-widget');
    if (delBtn) {
      const id = delBtn.dataset.widgetId;
      const isGraph = !!w.querySelector('canvas');
      refreshWidget(id, isGraph ? 'graph' : 'value');
    }
  });
}, 300000);

// Timer: Aktualizace textu "Updated: X ago" (30 sec)
setInterval(() => {
  document.querySelectorAll('.last-updated').forEach(el => {
    const rawTime = el.getAttribute('data-raw-time');
    if (rawTime) {
      el.innerText = `Updated: ${getTimeAgo(rawTime)}`;
    }
  });
}, 30000);
</script>
</body>
</html>
