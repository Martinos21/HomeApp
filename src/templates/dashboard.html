<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Home Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Added some quick styles for the new overlay interaction */
    .widget-content { cursor: pointer; transition: transform 0.2s; }
    .widget-content:hover { transform: translateY(-2px); }
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; }
    .modal-content { background: #1e293b; padding: 2rem; border-radius: 12px; width: 90%; max-width: 500px; color: white; }
    .graph-modal-content { max-width: 800px; width: 85%; }
    canvas { width: 100% !important; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h1 class="logo"><i class="fas fa-home"></i> SmartHome</h1>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="nav-item active"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="{{ url_for('devices') }}" class="nav-item"><i class="fas fa-lightbulb"></i> Devices</a>
      <a href="{{ url_for('settings') }}" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
    </nav>
  </div>

  <div class="main-content">
    <h2 class="page-title">Dashboard</h2>
    <p class="page-subtitle">Real-time sensor monitoring (Click card for history)</p>

    <div class="widget-container" id="widgetContainer">
      {% for w in widgets %}
        <div class="widget" id="container-{{ w.id }}">
          <div class="widget-content" onclick="showGraphOverlay('{{ w.id }}', '{{ w.title }}')">
            <h4>{{ w.title }}</h4>
            <p class="widget-meta">{{ w.sensor }} | {{ w.calc|upper }}</p>
            <span class="live-value" data-id="{{ w.id }}">--</span>
            <p class="last-updated" data-time-id="{{ w.id }}">Updated: --</p>
            <p>Source: {{ w.table }}</p>
          </div>
          <button class="delete-widget" data-widget-id="{{ w.id }}">
            <i class="fas fa-times"></i>
          </button>
        </div>
      {% endfor %}
    </div>
  </div>

  <button class="addCardButton"> + </button>

  <div class="modal" id="widgetModal">
    <div class="modal-content">
      <h3>Create New Widget</h3>

      <label>Widget Title</label>
      <input type="text" id="widgetTitle" placeholder="e.g. Living Room" />

      <label>Location (Table)</label>
      <select id="widgetType">
        {% for table in db_tables %}
          <option value="{{ table }}">{{ table|capitalize }}</option>
        {% endfor %}
      </select>

      <label>Sensor Type</label>
      <select id="sensorType">
        <option value="Temp">Temperature</option>
        <option value="Hum">Humidity</option>
        <option value="Press">CO2 / Pressure</option>
      </select>

      <label>Calculation</label>
      <select id="widgetCalc">
        <option value="last">Current Value</option>
        <option value="avg">Average</option>
        <option value="min">Minimum</option>
        <option value="max">Maximum</option>
      </select>

      <div class="modal-buttons">
        <button id="cancelBtn" style="background: transparent; color: #94a3b8;">Cancel</button>
        <button id="createBtn">Create</button>
      </div>
    </div>
  </div>

  <div class="modal" id="graphOverlay">
    <div class="modal-content graph-modal-content">
      <h3 id="overlayTitle">Sensor History</h3>
      <div style="height: 350px; margin: 20px 0;">
        <canvas id="overlayChart"></canvas>
      </div>
      <div class="modal-buttons">
        <button id="closeOverlayBtn">Close</button>
      </div>
    </div>
  </div>

<script>
const container = document.getElementById('widgetContainer');
const widgetModal = document.getElementById('widgetModal');
const graphOverlay = document.getElementById('graphOverlay');
const addBtn = document.querySelector('.addCardButton');
const overlayChartCanvas = document.getElementById('overlayChart');

let globalOverlayChart = null;

/**
 * 1. UTILITY FUNCTIONS
 */
function getTimeAgo(dateString) {
  if (!dateString || dateString === "None") return "Never";
  const past = new Date(dateString.replace(/-/g, "/"));
  const now = new Date();
  const seconds = Math.floor((now - past) / 1000);
  if (seconds < 60) return "Just now";
  if (seconds < 3600) return Math.floor(seconds / 60) + "m ago";
  if (seconds < 86400) return Math.floor(seconds / 3600) + "h ago";
  return Math.floor(seconds / 86400) + "d ago";
}

/**
 * 2. MODAL & OVERLAY LOGIC
 */
addBtn.onclick = () => { widgetModal.style.display = 'flex'; };
document.getElementById('cancelBtn').onclick = () => { widgetModal.style.display = 'none'; };
document.getElementById('closeOverlayBtn').onclick = () => { graphOverlay.style.display = 'none'; };

function showGraphOverlay(widgetId, title) {
  fetch(`/api/widget_history/${widgetId}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById('overlayTitle').innerText = `${title} - History (Last 20)`;
      graphOverlay.style.display = 'flex';

      if (globalOverlayChart) globalOverlayChart.destroy();

      globalOverlayChart = new Chart(overlayChartCanvas.getContext('2d'), {
        type: 'line',
        data: {
          labels: data.labels,
          datasets: [{
            label: 'Value',
            data: data.values,
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59, 130, 246, 0.1)',
            fill: true,
            tension: 0.4,
            pointRadius: 4,
            pointBackgroundColor: '#3b82f6'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
            x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
          },
          plugins: { legend: { display: false } }
        }
      });
    });
}

/**
 * 3. DATA REFRESH
 */
function refreshWidget(widgetId) {
  fetch(`/api/widget_data/${widgetId}`)
    .then(res => res.json())
    .then(data => {
      const valEl = document.querySelector(`.live-value[data-id="${widgetId}"]`);
      const timeEl = document.querySelector(`.last-updated[data-time-id="${widgetId}"]`);

      if (valEl) valEl.innerText = data.value;
      if (timeEl && data.timestamp) {
        timeEl.setAttribute('data-raw-time', data.timestamp);
        timeEl.innerText = `Updated: ${getTimeAgo(data.timestamp)}`;
      }
    })
    .catch(err => console.error("Error updating widget:", err));
}

/**
 * 4. WIDGET ACTIONS (CREATE / DELETE)
 */
function setupDeleteListener(btn) {
  btn.onclick = (e) => {
    e.stopPropagation(); // Prevent opening the graph when deleting
    const id = btn.dataset.widgetId;
    fetch('/delete_widget', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id })
    }).then(() => document.getElementById(`container-${id}`).remove());
  };
}

document.getElementById('createBtn').onclick = () => {
  const payload = {
    title: document.getElementById('widgetTitle').value,
    type: document.getElementById('widgetType').value,
    sensor: document.getElementById('sensorType').value,
    calc: document.getElementById('widgetCalc').value
  };

  if (!payload.title) return alert("Title is required");

  fetch('/add_widget', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      const div = document.createElement('div');
      div.className = 'widget';
      div.id = `container-${data.id}`;
      div.innerHTML = `
        <div class="widget-content" onclick="showGraphOverlay('${data.id}', '${payload.title}')">
          <h4>${payload.title}</h4>
          <p class="widget-meta">${payload.sensor} | ${payload.calc.toUpperCase()}</p>
          <span class="live-value" data-id="${data.id}">--</span>
          <p class="last-updated" data-time-id="${data.id}">Updated: --</p>
          <p>Source: ${payload.type}</p>
        </div>
        <button class="delete-widget" data-widget-id="${data.id}"><i class="fas fa-times"></i></button>
      `;
      container.appendChild(div);
      setupDeleteListener(div.querySelector('.delete-widget'));
      refreshWidget(data.id);
      widgetModal.style.display = 'none';
    }
  });
};

/**
 * 5. INITIALIZATION
 */
document.querySelectorAll('.delete-widget').forEach(setupDeleteListener);

// Initial Load & Timers
const runAutoRefresh = () => {
  document.querySelectorAll('.live-value').forEach(el => refreshWidget(el.dataset.id));
};

runAutoRefresh();
setInterval(runAutoRefresh, 300000); // DB Refresh every 5m

setInterval(() => {
  document.querySelectorAll('.last-updated').forEach(el => {
    const raw = el.getAttribute('data-raw-time');
    if (raw) el.innerText = `Updated: ${getTimeAgo(raw)}`;
  });
}, 30000); // UI "Time Ago" update every 30s
</script>
</body>
</html>
