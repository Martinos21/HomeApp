<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Home Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h1 class="logo">
      <i class="fas fa-home"></i> SmartHome
    </h1>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="nav-item active">
        <i class="fas fa-th-large"></i> Dashboard
      </a>
      <a href="{{ url_for('devices') }}" class="nav-item">
        <i class="fas fa-lightbulb"></i> Devices
      </a>
      <a href="{{ url_for('settings') }}" class="nav-item">
        <i class="fas fa-cog"></i> Settings
      </a>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <h2 class="page-title">Dashboard</h2>
    <p class="page-subtitle">Welcome to your smart home dashboard!</p>
    <div class="widget-container">
      {% for w in widgets %}
        <div class="widget">{{ w }}</div>
      {% endfor %}
    </div>
  </div>
<button class="addCardButton" > + </button>
<!-- Modal -->
<div class="modal" id="widgetModal">
  <div class="modal-content">
    <h3>Create Widget</h3>

    <label>Widget Title</label>
    <input type="text" id="widgetTitle" placeholder="Enter widget name" />

    <label>Data to display</label>
    <select id="widgetType">
      <option value="temperature">Temperature</option>
      <option value="humidity">Humidity</option>
      <option value="energy">Energy Usage</option>
      <option value="lights">Lights Status</option>
    </select>

    <div class="modal-buttons">
      <button id="cancelBtn">Cancel</button>
      <button id="createBtn">Create</button>
    </div>
  </div>
</div>
</body>
<script>
  const button = document.querySelector('.addCardButton');
  const container = document.querySelector('.widget-container');

  const modal = document.getElementById('widgetModal');
  const cancelBtn = document.getElementById('cancelBtn');
  const createBtn = document.getElementById('createBtn');

  const titleInput = document.getElementById('widgetTitle');
  const typeSelect = document.getElementById('widgetType');

  // Open form
  button.addEventListener('click', () => {
    modal.style.display = 'flex';
  });

  // Close form
  cancelBtn.addEventListener('click', () => {
    modal.style.display = 'none';
  });

  // Create widget
  createBtn.addEventListener('click', () => {
    const title = titleInput.value;
    const type = typeSelect.value;

    if (!title) {
      alert("Please enter a widget title");
      return;
    }

    fetch('/add_widget', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, type })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        const widget = document.createElement('div');
        widget.classList.add('widget');
        widget.innerHTML = `
          <h4>${title}</h4>
          <p>Type: ${type}</p>
        `;
        container.appendChild(widget);

        // Reset and close
        titleInput.value = '';
        modal.style.display = 'none';
      }
    });
  });
</script>


</html>
