<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devices | Smart Home Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='devices.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h1 class="logo">
      <i class="fas fa-home"></i> SmartHome
    </h1>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="{{ url_for('devices') }}" class="nav-item active"><i class="fas fa-lightbulb"></i> Devices</a>
      <a href="{{ url_for('settings') }}" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <h2 class="page-title">All Devices</h2>
    <p class="page-subtitle">Manage and monitor your smart home devices</p>

    <div class="device-grid">
      <div class="device-card">
        <div class="device-header">
          <h3 class="device-name">Living Room Light</h3>
          <i class="fas fa-lightbulb icon yellow"></i>
        </div>
        <p class="device-status">Status: <span class="status on">ON</span></p>
      </div>

      <div class="device-card">
        <div class="device-header">
          <h3 class="device-name">Thermostat</h3>
          <i class="fas fa-temperature-high icon orange"></i>
        </div>
        <p class="device-status">Temperature: <span class="value">22°C</span></p>
      </div>

      <div class="device-card">
        <div class="device-header">
          <h3 class="device-name">Garage Door</h3>
          <i class="fas fa-warehouse icon blue"></i>
        </div>
        <p class="device-status">Status: <span class="status off">Closed</span></p>
      </div>
    </div>
  </div>
</body>
</html>
