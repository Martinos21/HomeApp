 <!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Smart Home Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='settings.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="sidebar">
    <h1 class="logo">
      <i class="fas fa-home"></i> SmartHome
    </h1>
    <nav>
        <a href="{{ url_for('dashboard') }}" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="{{ url_for('automation') }}" class="nav-item"><i class="fas fa-robot"></i> Automation</a>
        <a href="{{ url_for('settings') }}" class="nav-item active"><i class="fas fa-cog"></i> Settings</a>
    </nav>
  </div>

  <div class="main-content">
    <h2 class="page-title">Nastavení</h2>
    <p class="page-subtitle">Konfigurace preferencí vaší chytré domácnosti</p>

    <div class="settings-panel">
      <form class="settings-form">

        <div class="form-group">
          <label for="username">Jméno správce</label>
          <input id="username" type="text" placeholder="Např. Admin" value="Domácí uživatel">
        </div>

        <div class="form-group">
          <label for="email">Notifikační e-mail</label>
          <input id="email" type="email" placeholder="email@domov.cz">
        </div>

        <hr style="border: 0; border-top: 1px solid #334155; margin: 0.5rem 0;">

        <div class="form-group">
          <label for="refresh">Interval aktualizace dat</label>
          <select id="refresh">
            <option value="5">Každých 5 sekund</option>
            <option value="30">Každých 30 sekund</option>
            <option value="60">Každou minutu</option>
          </select>
        </div>

        <hr style="border: 0; border-top: 1px solid #334155; margin: 0.5rem 0;">

        <div class="form-group">
          <label for="temp-unit">Jednotky teploty</label>
          <select id="temp-unit">
            <option value="c">Celsius (°C)</option>
            <option value="f">Fahrenheit (°F)</option>
          </select>
        </div>

        <div class="form-group">
          <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
            <input type="checkbox" id="security" style="width: auto;">
            Aktivovat noční hlídání (22:00 - 06:00)
          </label>
        </div>

        <button type="submit" class="save-button">
          <i class="fas fa-save"></i> Uložit nastavení
        </button>
      </form>
    </div>
  </div>
</body>
</html>
