<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Smart Home Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='settings.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h1 class="logo">
      <i class="fas fa-home"></i> SmartHome
    </h1>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="{{ url_for('devices') }}" class="nav-item"><i class="fas fa-lightbulb"></i> Devices</a>
      <a href="{{ url_for('settings') }}" class="nav-item active"><i class="fas fa-cog"></i> Settings</a>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <h2 class="page-title">Settings</h2>
    <p class="page-subtitle">Configure your smart home preferences</p>

    <div class="settings-panel">
      <form class="settings-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" type="text" placeholder="Enter username">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="Enter email address">
        </div>

        <div class="form-group">
          <label for="theme">Theme</label>
          <select id="theme">
            <option>Dark</option>
            <option>Light</option>
          </select>
        </div>

        <button type="submit" class="save-button">
          <i class="fas fa-save"></i> Save Settings
        </butt
